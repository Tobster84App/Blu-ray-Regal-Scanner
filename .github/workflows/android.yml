name: Android

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  test:
    name: Analyse und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    name: APK bauen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signatur-Schlüssel aus Secrets (falls vorhanden)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/key.properties
            echo "Release-Signatur aktiv."
          else
            echo "Kein Keystore-Secret – APK wird mit Debug-Schlüssel signiert."
          fi
      - run: flutter pub get
      - name: Release-APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: flutter build apk --release --dart-define=TMDB_API_KEY="$TMDB_API_KEY"
      - name: APK umbenennen
        run: |
          NAME=$(grep -oP 'APP_NAME = "\K[^"]+' lib/config/app_config.dart)
          VER=$(grep -oP '^version: \K\S+' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${NAME}-${VER}-${GITHUB_SHA::7}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30

  ocr-eval:
    name: Erkennung auf Referenzfoto messen (Emulator)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Testfoto vorhanden?
        id: fixture
        run: |
          if [ -f test/fixtures/shelf_01.jpg ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "Kein test/fixtures/shelf_01.jpg – übersprungen."; fi
      - uses: actions/setup-java@v6.3.0
        if: steps.fixture.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2.23.0
        if: steps.fixture.outputs.present == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: KVM aktivieren
        if: steps.fixture.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Foto einbetten
        if: steps.fixture.outputs.present == 'true'
        run: |
          python3 tool/embed_fixture.py
          flutter pub get
      - name: Emulator-Test
        if: steps.fixture.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/ocr_eval_test.dart --dart-define=TMDB_API_KEY="$TMDB_API_KEY"
      - name: Bericht anzeigen
        if: always() && steps.fixture.outputs.present == 'true'
        run: |
          if [ -f build/ocr_report.md ]; then cat build/ocr_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.fixture.outputs.present == 'true'
        with:
          name: ocr-bericht
          path: |
            build/ocr_report.md
            build/ocr_lines.json
          if-no-files-found: ignore
